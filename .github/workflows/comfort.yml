name: comfort

# ▶️ Comfort = "riprendi automatico": azzera l'emergenza e TUTTI gli override manuali,
# così l'automatismo torna a gestire tutto. Invocabile col Token-B (Actions:write).
# Con l'input dsn riprende l'automatico per UNA sola stanza (emergenza e altre stanze restano).
on:
  workflow_dispatch:
    inputs:
      dsn:
        description: "DSN del clima (vuoto = tutte le stanze)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write     # per lanciare subito un giro del ponte

# Niente gruppo di concorrenza: in un gruppo un Comfort in attesa verrebbe annullato dal successivo
# (per esempio Soggiorno e poi Eva). I conflitti di push col ponte li gestisce comfort_salva.sh.
jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Riprendi automatico e salva (riprova se il ponte ha appena salvato)
        env:
          DSN: ${{ inputs.dsn }}
        run: |
          git config user.name clima
          git config user.email clima@local
          sh comfort_salva.sh "$DSN"
      - name: Giro del ponte subito (la stanza torna al ponte in 1-2 minuti)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bridge.yml --ref main
